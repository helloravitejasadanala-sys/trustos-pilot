<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border:1px solid var(--border); border-radius:20px; background:var(--surface2); box-shadow:var(--shadow-lg); overflow:hidden;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 24px; border-bottom:1px solid var(--border2); background:var(--surface);">
    <div>
      <div style="font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);">{{ weekday }}</div>
      <div style="font-family:var(--disp); font-size:20px; font-weight:600; letter-spacing:-0.02em; margin-top:2px;">Today's work</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="width:8px; height:8px; border-radius:50%; background:var(--ok);"></span>
      <span style="font-size:13px; color:var(--muted);">4 projects live</span>
    </div>
  </div>

  <div style="padding:18px; display:grid; grid-template-columns:1.15fr 1fr; gap:18px;">
    <div style="display:flex; flex-direction:column; gap:10px;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <div style="display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; background:var(--surface); border:1px solid var(--border); transition:transform .18s ease, border-color .18s ease;" style-hover="transform:translateX(3px); border-color:var(--accent);">
          <div style="width:44px; text-align:center; flex-shrink:0;">
            <div style="font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.04em;">{{ it.when }}</div>
          </div>
          <div style="width:3px; align-self:stretch; border-radius:2px; background:{{ it.bar }}; flex-shrink:0;"></div>
          <div style="min-width:0; flex:1;">
            <div style="font-size:14.5px; font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ it.title }}</div>
            <div style="font-size:12.5px; color:var(--muted); margin-top:2px;">{{ it.project }}</div>
          </div>
          <span style="font-size:11px; font-weight:600; color:{{ it.tagColor }}; background:{{ it.tagBg }}; padding:4px 9px; border-radius:7px; white-space:nowrap; flex-shrink:0;">{{ it.tag }}</span>
        </div>
      </sc-for>
    </div>

    <div style="border-radius:16px; border:1px solid var(--accent); background:var(--accent-soft); padding:22px; display:flex; flex-direction:column;">
      <div style="font-size:11px; font-weight:600; color:var(--accent); letter-spacing:.08em; text-transform:uppercase;">One clear next action</div>
      <div style="font-family:var(--disp); font-size:22px; font-weight:600; letter-spacing:-0.02em; line-height:1.15; margin:12px 0 8px;">Send Amara &amp; Daniel their contract</div>
      <div style="font-size:13px; color:var(--muted); line-height:1.5;">Quote accepted this morning. TrustOS drafted the contract from your template.</div>
      <div style="margin-top:auto; padding-top:18px;">
        <button style="width:100%; padding:13px; border-radius:11px; border:none; background:var(--accent); color:var(--on-accent); font-family:inherit; font-weight:600; font-size:14.5px; cursor:pointer; transition:transform .15s ease;" style-hover="transform:translateY(-2px);">Review &amp; send</button>
        <div style="display:flex; align-items:center; justify-content:center; gap:7px; margin-top:12px; font-size:12px; color:var(--muted);">
          <span style="width:5px; height:5px; border-radius:50%; background:var(--accent);"></span> Takes about 40 seconds
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;860px&quot;,&quot;height&quot;:&quot;400px&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      weekday: 'Thursday, 23 July',
      items: [
        { when: '09:00', title: 'Review questionnaire', project: 'Priya & Sam \u00B7 Engagement', tag: 'New', bar: 'var(--accent)', tagColor: 'var(--accent)', tagBg: 'var(--accent-soft)' },
        { when: 'Due', title: 'Deposit pending', project: 'Okafor 40th \u00B7 \u00A3400', tag: 'Awaiting', bar: '#d98b2b', tagColor: '#b45309', tagBg: 'rgba(217,139,43,.14)' },
        { when: 'Tmrw', title: 'Shoot day', project: 'Verve Brand Shoot', tag: 'Prep ready', bar: 'var(--ok)', tagColor: 'var(--ok)', tagBg: 'var(--ok-soft)' },
        { when: 'Fri', title: 'Delivery due', project: 'Chen Wedding \u00B7 gallery', tag: 'On track', bar: 'var(--muted)', tagColor: 'var(--muted)', tagBg: 'var(--surface)' },
      ],
    };
  }
}
</script>
</body>
</html>
