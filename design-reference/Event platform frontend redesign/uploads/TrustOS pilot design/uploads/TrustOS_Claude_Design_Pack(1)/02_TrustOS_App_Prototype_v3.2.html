<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustOS — Product Blueprint v3.2 · Final Freeze Before Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --ink:#17211B; --ink2:#647067;
  --green:#287A5B; --green-d:#174B39; --green-s:#E7F3EC;
  --amber:#D98B2B; --amber-s:#F8EEDF;
  --blue:#3F6FD8; --blue-s:#E8EEFB;
  --purple:#7655C9; --purple-s:#EFEAFA;
  --red:#C94949; --red-s:#FAE9E9;
  --grey:#8B948C; --grey-s:#EDEFEC;
  --border:#DDE3DE; --r:12px; --r-s:8px;
  --shadow:0 1px 2px rgba(23,33,27,.05),0 4px 14px rgba(23,33,27,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
a{color:var(--green);text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-rows:auto auto 1fr;min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.logo{font-family:'Space Grotesk';font-weight:700;font-size:18px;color:var(--green-d);display:flex;align-items:center;gap:8px}
.logo .dot{width:10px;height:10px;border-radius:3px;background:var(--green);display:inline-block}
.logo small{font-weight:500;color:var(--ink2);font-size:11px;letter-spacing:.04em}
.rolesw{display:flex;background:var(--grey-s);border-radius:99px;padding:3px;gap:2px}
.rolesw button{border:none;background:transparent;padding:6px 14px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.rolesw button.on{background:var(--surface);color:var(--green-d);box-shadow:var(--shadow)}
.viewsw{margin-left:auto;display:flex;gap:6px;align-items:center}
.viewsw button{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;color:var(--ink2)}
.viewsw button.on{border-color:var(--green);color:var(--green-d);background:var(--green-s)}

/* filter bar */
.filterbar{display:flex;align-items:center;gap:8px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap}
.filterbar .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
.chip{border:1px solid var(--border);background:var(--surface);padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:8px;height:8px;border-radius:99px;display:inline-block}
.chip.on{color:var(--ink);border-color:currentColor}
.chip.on.c1a{color:var(--amber);background:var(--amber-s)} .chip.on.c1b{color:var(--green);background:var(--green-s)}
.chip.on.c2{color:var(--blue);background:var(--blue-s)} .chip.on.c3{color:var(--purple);background:var(--purple-s)}
.chip.on.cpl{color:var(--grey);background:var(--grey-s)} .chip.on.call{color:var(--green-d);background:var(--green-s);border-color:var(--green)}
.dimmed{opacity:.28;filter:grayscale(.6);pointer-events:none}

/* layout */
.layout{display:grid;grid-template-columns:212px 1fr;min-height:0}
.sidenav{background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:96px;height:calc(100vh - 96px);overflow-y:auto}
.sidenav .grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:12px 10px 4px}
.sidenav button{display:flex;width:100%;align-items:center;gap:9px;border:none;background:transparent;padding:8px 10px;border-radius:var(--r-s);font-size:13.5px;font-weight:500;color:var(--ink);text-align:left}
.sidenav button:hover{background:var(--grey-s)}
.sidenav button.on{background:var(--green-s);color:var(--green-d);font-weight:600}
.sidenav .ic{width:18px;text-align:center;opacity:.75}
.main{padding:22px clamp(14px,3vw,34px) 90px;max-width:1080px;width:100%}
.crumbs{font-size:12px;color:var(--ink2);margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs button{border:none;background:none;color:var(--green);font-size:12px;font-weight:600;padding:0}
.backbtn{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--ink2);margin-right:4px}

/* screen header */
.shead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.shead h1{font-size:clamp(19px,2.4vw,24px);font-weight:700}
.shead .sub{color:var(--ink2);font-size:13px;margin-top:3px;max-width:620px}
.shead .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* phase badges */
.pb{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pb::before{content:"";width:7px;height:7px;border-radius:99px;background:currentColor}
.pb.p1a{color:#9A6118;background:var(--amber-s)} .pb.p1b{color:var(--green-d);background:var(--green-s)}
.pb.p2{color:#2C51A6;background:var(--blue-s)} .pb.p3{color:#57408F;background:var(--purple-s)}
.pb.ppl{color:#5E665F;background:var(--grey-s)}
.mtag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:6px;text-transform:uppercase}
.mtag.man{color:#9A6118;background:var(--amber-s)} .mtag.auto{color:#2C51A6;background:var(--blue-s)} .mtag.coded{color:var(--green-d);background:var(--green-s)}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:14.5px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .hint{font-size:12px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stack{display:grid;gap:14px}
.mt{margin-top:14px}

/* ONE CLEAR NEXT ACTION — signature component */
.next-action{background:linear-gradient(0deg,var(--surface),var(--surface));border:1px solid var(--border);border-left:5px solid var(--green);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.next-action .k{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-d);background:var(--green-s);padding:3px 9px;border-radius:6px}
.next-action h2{font-size:clamp(16px,2vw,20px);font-weight:700;flex:1 1 260px}
.next-action .why{font-size:12px;color:var(--ink2);width:100%}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;border:1px solid transparent;transition:.12s}
.btn.pri{background:var(--green);color:#fff}.btn.pri:hover{background:var(--green-d)}
.btn.sec{background:var(--surface);border-color:var(--border);color:var(--ink)}.btn.sec:hover{border-color:var(--green);color:var(--green-d)}
.btn.ghost{background:transparent;color:var(--ink2)}.btn.ghost:hover{color:var(--ink)}
.btn.warn{background:var(--red);color:#fff}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* list rows */
.rows{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .t{font-weight:600;font-size:13.5px}
.row .s{font-size:12px;color:var(--ink2)}
.row .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .ico{width:34px;height:34px;border-radius:9px;background:var(--green-s);color:var(--green-d);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}

/* status pills */
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st.due{background:var(--amber-s);color:#9A6118}.st.proc{background:var(--blue-s);color:#2C51A6}
.st.paid,.st.done{background:var(--green-s);color:var(--green-d)}
.st.over,.st.fail,.st.block{background:var(--red-s);color:var(--red)}
.st.ref,.st.na{background:var(--grey-s);color:#5E665F}
.st.wait{background:var(--grey-s);color:#5E665F}

/* progress / timeline */
.prog{height:7px;border-radius:99px;background:var(--grey-s);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl .ev{position:relative;padding:9px 0}
.tl .ev::before{content:"";position:absolute;left:-19px;top:14px;width:10px;height:10px;border-radius:99px;background:var(--surface);border:2.5px solid var(--green)}
.tl .ev.future::before{border-color:var(--border)}
.tl .ev.now::before{background:var(--green)}
.tl .ev .t{font-weight:600;font-size:13.5px}
.tl .ev .s{font-size:12px;color:var(--ink2)}

/* stage rail (journey) */
.rail{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.rail .stg{flex:0 0 148px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer}
.rail .stg:hover{border-color:var(--green)}
.rail .stg .n{font-size:10px;font-weight:800;color:var(--ink2);letter-spacing:.08em}
.rail .stg .t{font-size:12.5px;font-weight:600;margin:3px 0 6px}

/* forms */
.field{display:grid;gap:5px;margin-bottom:11px}
.field label{font-size:12px;font-weight:600;color:var(--ink2)}
.field .inp{border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13.5px;background:var(--surface);color:var(--ink)}
.field .inp.filled{color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{border-color:var(--green);background:var(--green-s);color:var(--green-d)}

/* checklists */
.ck{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13.5px}
.ck:last-child{border-bottom:none}
.ck .box{width:19px;height:19px;border-radius:6px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.ck.done .box{background:var(--green);border-color:var(--green)}
.ck.done span{color:var(--ink2)}
.ck .end{margin-left:auto}

/* moodboard */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tile{aspect-ratio:4/5;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--border);display:flex;align-items:flex-end;font-size:11px;font-weight:600;color:#fff;padding:8px;cursor:pointer}
.tile .fav{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9);color:var(--ink2);border-radius:99px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:none;font-size:12px}
.tile.faved .fav{color:var(--red)}

/* feature card */
.fcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.fcard .top{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fcard .top h3{font-size:14px}
.fcard .mid{padding:13px 15px;background:var(--bg);font-size:12.5px;display:grid;gap:5px}
.fcard .bot{padding:13px 15px;font-size:12px;color:var(--ink2);display:grid;gap:4px}
.fcard .bot b{color:var(--ink)}
.kv{display:flex;gap:8px}.kv b{flex:0 0 108px;font-weight:600;color:var(--ink2);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}

/* parking lot */
.pl-card{background:var(--surface);border:1px dashed var(--grey);border-radius:var(--r);padding:14px}
.pl-card h4{font-size:13.5px;display:flex;gap:8px;align-items:center}
.pl-card .g{font-size:12px;color:var(--ink2);margin-top:6px;display:grid;gap:3px}

/* banner */
.note{border-radius:10px;padding:11px 14px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.note.amber{background:var(--amber-s);color:#7A4C10}
.note.green{background:var(--green-s);color:var(--green-d)}
.note.red{background:var(--red-s);color:var(--red)}
.note.grey{background:var(--grey-s);color:#4C544D}

/* device previews */
.devbar{display:flex;gap:6px;align-items:center}
.phone-frame{max-width:390px;margin:0 auto;border:1px solid var(--border);border-radius:26px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.phone-frame .notch{height:22px;display:flex;justify-content:center;align-items:center}
.phone-frame .notch i{width:90px;height:5px;border-radius:99px;background:var(--grey-s)}
body.mobile .layout{grid-template-columns:1fr}
body.mobile .sidenav{display:none}
body.mobile .main{padding:16px 14px 96px;max-width:520px;margin:0 auto}
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:60;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
body.mobile .bottomnav{display:flex;justify-content:space-around}
.bottomnav button{border:none;background:none;display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--ink2);padding:4px 8px;border-radius:8px}
.bottomnav button.on{color:var(--green-d)}
.bottomnav .ic{font-size:17px}
@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidenav{display:none}
  .bottomnav{display:flex;justify-content:space-around}
  .grid2,.grid3{grid-template-columns:1fr}
  .main{padding:16px 14px 96px}
}
@media(min-width:861px){ body:not(.mobile) .bottomnav{display:none!important} }
table.inv{width:100%;border-collapse:collapse;font-size:11.5px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
table.inv th{background:var(--green-s);color:var(--green-d);text-align:left;padding:7px 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
table.inv td{padding:7px 9px;border-top:1px solid var(--border);vertical-align:top}
.footer-note{margin-top:26px;font-size:11.5px;color:var(--ink2);border-top:1px solid var(--border);padding-top:12px}
.jump{border:none;background:none;color:var(--green);font-weight:600;font-size:12.5px;padding:0}

/* ---------- v3 polish ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.main>*{animation:fadeUp .22s ease both}
.card,.fcard,.pl-card,.ffcol{transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease}
.card:hover,.fcard:hover{box-shadow:0 2px 4px rgba(23,33,27,.06),0 10px 26px rgba(23,33,27,.1)}
.btn{transition:background .15s ease,border-color .15s ease,transform .12s ease,box-shadow .15s ease}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(40,122,91,.28)}
.prog i{transition:width .5s ease}
.skel{background:linear-gradient(90deg,var(--grey-s) 25%,#f3f5f2 50%,var(--grey-s) 75%);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:8px}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
/* phase emphasis: current pilot dominant, later phases muted */
.pb.p2,.pb.p3{opacity:.72}
.pb.ppl{opacity:.65;border:1px dashed var(--grey)}
/* project workspace */
.wstabs{display:flex;gap:2px;overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:16px}
.wstabs button{border:none;background:transparent;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;min-height:34px}
.wstabs button:hover{background:var(--grey-s);color:var(--ink)}
.wstabs button.on{background:var(--green-s);color:var(--green-d)}
.wsgrid{display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:18px;align-items:start}
.wsside{position:sticky;top:104px;display:grid;gap:12px}
.wsside .card{padding:13px}
.wsside h3{font-size:12px}
.wsside .rows .row{padding:7px 2px}
@media(max-width:1060px){.wsgrid{grid-template-columns:1fr}.wsside{position:static;grid-template-columns:1fr 1fr;display:grid}}
@media(max-width:640px){.wsside{grid-template-columns:1fr}}
body.mobile .wsgrid{grid-template-columns:1fr}
body.mobile .wsside{position:static}
.wshead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.wshead h2{font-size:15px}
@media print{.wstabs,.wsside{display:none!important}.wsgrid{display:block}}
/* ---------- v2 additions ---------- */
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;animation:none!important}}
.topbar button,.filterbar .chip,.sidenav button,.bottomnav button{min-height:34px}
@media(pointer:coarse){.btn,.chip,.sidenav button,.bottomnav button,.rolesw button{min-height:44px}}
.notifpanel{position:fixed;top:52px;right:14px;width:min(360px,92vw);max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 10px 40px rgba(23,33,27,.18);z-index:100;padding:10px;display:none}
.notifpanel.open{display:block}
.notifpanel h4{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:6px 8px 2px}
.notifpanel .ni{display:flex;gap:9px;width:100%;text-align:left;border:none;background:none;padding:8px;border-radius:8px;align-items:flex-start}
.notifpanel .ni:hover{background:var(--grey-s)}
.notifpanel .ni .t{font-size:12.5px;font-weight:600}.notifpanel .ni .s{font-size:11.5px;color:var(--ink2)}
.modal-back{position:fixed;inset:0;background:rgba(23,33,27,.35);z-index:120;display:none;align-items:center;justify-content:center;padding:16px}
.modal-back.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r);max-width:460px;width:100%;padding:18px;box-shadow:0 16px 60px rgba(23,33,27,.3)}
.ffcol{border-top:4px solid var(--border);border-radius:var(--r);background:var(--surface);border:1px solid var(--border);border-top-width:4px;padding:14px}
.ffcol h3{font-size:14px;margin-bottom:8px}
.ffcol ul{margin-left:16px;font-size:12.5px;line-height:1.7}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1000px){.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.grid4{grid-template-columns:1fr}}
#tourpanel{position:fixed;right:14px;bottom:14px;width:min(340px,92vw);background:var(--surface);border:1px solid var(--green);border-radius:var(--r);box-shadow:0 12px 44px rgba(23,33,27,.22);z-index:110;padding:12px;display:none}
body.mobile #tourpanel{bottom:70px}
@media(max-width:860px){#tourpanel{bottom:70px}}
#printzone{display:none}
.print-sec{page-break-after:always}
.print-head{display:none}
@media print{
 @page{size:A4 landscape;margin:12mm}
 body.printing-set #app{display:none!important}
 body.printing-set #printzone{display:block!important}
 #tourpanel{display:none!important}
 body{background:#fff!important;font-size:12px}
 .topbar,.filterbar,.sidenav,.bottomnav,.crumbs,.notifpanel,.modal-back,.viewsw,.btnrow .ghost{display:none!important}
 .layout{display:block}
 .main{max-width:none;padding:0}
 .card,.fcard,.pl-card,.ffcol{box-shadow:none!important;break-inside:avoid;page-break-inside:avoid}
 .fcard,.pl-card{page-break-after:auto}
 .rail{flex-wrap:wrap;overflow:visible}
 .print-head{display:block;border-bottom:2px solid var(--green-d);margin-bottom:10mm;padding-bottom:4mm}
 .print-head h1{font-size:18pt}.print-head .s{font-size:9pt;color:#4C544D}
 .sidenav,[style*="position:sticky"]{position:static!important}
 .dimmed{opacity:.4}
 a::after{content:""}
 .next-action{border-left-width:5px}
 .grid2,.grid3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">

function invMatch(r){
 const q=(dGet('inv-q','')||'').toLowerCase();
 const fp=dGet('inv-p','all'), fr=dGet('inv-r','all'), fs=dGet('inv-s','all');
 if(q && !r.join(' ').toLowerCase().includes(q))return false;
 if(fp!=='all' && !r[4].includes(fp))return false;
 if(fr!=='all' && !r[2].toLowerCase().includes(fr))return false;
 if(fs!=='all' && r[5]!==fs)return false;
 if(IF!=='all' && r[5]!==IFTEXT[IF])return false;
 return true;}
