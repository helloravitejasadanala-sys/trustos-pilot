<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid; grid-template-columns:repeat(6,1fr); gap:16px;">

  <div style="grid-column:span 4; border:1px solid var(--border); border-radius:20px; background:var(--surface2); padding:24px; box-shadow:var(--shadow); min-height:210px;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
      <span dangerouslySetInnerHTML="{{ iconTimeline }}" style="color:var(--accent);"></span>
      <span style="font-size:14px; font-weight:600;">Timeline</span>
    </div>
    <div style="position:relative; height:2px; background:var(--border); margin:16px 10px 0; border-radius:2px;">
      <div style="position:absolute; left:0; top:0; height:100%; width:55%; background:var(--accent); border-radius:2px;"></div>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:-9px;">
      <sc-for list="{{ tl }}" as="s" hint-placeholder-count="6">
        <div style="display:flex; flex-direction:column; align-items:center; gap:9px;">
          <span style="width:16px; height:16px; border-radius:50%; background:{{ s.dot }}; border:2px solid var(--surface2); box-shadow:{{ s.ring }};"></span>
          <span style="font-size:11.5px; color:{{ s.color }}; font-weight:{{ s.weight }}; white-space:nowrap;">{{ s.label }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="grid-column:span 2; border:1px solid var(--border); border-radius:20px; background:var(--surface2); padding:24px; box-shadow:var(--shadow);">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <span dangerouslySetInnerHTML="{{ iconPay }}" style="color:var(--accent);"></span>
      <span style="font-size:14px; font-weight:600;">Payments</span>
    </div>
    <div style="font-size:26px; font-weight:600; letter-spacing:-0.02em;">£1,400</div>
    <div style="font-size:12.5px; color:var(--muted); margin-top:2px;">of £3,500 · deposit paid</div>
    <div style="height:6px; border-radius:4px; background:var(--border); margin-top:14px; overflow:hidden;"><div style="width:40%; height:100%; background:var(--ok);"></div></div>
    <div style="display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12px; color:var(--muted);">
      <span style="width:6px; height:6px; border-radius:50%; background:var(--ok);"></span> Stripe · Cash tracked
    </div>
  </div>

  <div style="grid-column:span 2; border:1px solid var(--border); border-radius:20px; background:var(--surface2); padding:24px; box-shadow:var(--shadow);">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <span dangerouslySetInnerHTML="{{ iconFiles }}" style="color:var(--accent);"></span>
      <span style="font-size:14px; font-weight:600;">Files</span>
    </div>
    <sc-for list="{{ files }}" as="f" hint-placeholder-count="3">
      <div style="display:flex; align-items:center; gap:11px; padding:8px 0; border-top:1px solid var(--border2);">
        <span style="width:30px; height:30px; border-radius:8px; background:var(--surface); border:1px solid var(--border); display:grid; place-items:center; font-size:9px; font-weight:700; color:var(--muted); flex-shrink:0;">{{ f.ext }}</span>
        <div style="min-width:0;">
          <div style="font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ f.name }}</div>
          <div style="font-size:11px; color:var(--muted);">{{ f.size }}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="grid-column:span 2; border:1px solid var(--border); border-radius:20px; background:var(--surface2); padding:24px; box-shadow:var(--shadow);">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <span dangerouslySetInnerHTML="{{ iconMsg }}" style="color:var(--accent);"></span>
      <span style="font-size:14px; font-weight:600;">Messages</span>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="align-self:flex-start; max-width:85%; padding:9px 13px; border-radius:13px 13px 13px 3px; background:var(--surface); border:1px solid var(--border2); font-size:12.5px; color:var(--text2); line-height:1.4;">Can we add an hour of coverage?</div>
      <div style="align-self:flex-end; max-width:85%; padding:9px 13px; border-radius:13px 13px 3px 13px; background:var(--accent); color:var(--on-accent); font-size:12.5px; line-height:1.4;">Absolutely — I\u2019ll update the quote now.</div>
    </div>
  </div>

  <div style="grid-column:span 2; border:1px solid var(--border); border-radius:20px; background:var(--surface2); padding:24px; box-shadow:var(--shadow);">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <span dangerouslySetInnerHTML="{{ iconPrep }}" style="color:var(--accent);"></span>
      <span style="font-size:14px; font-weight:600;">Preparation</span>
    </div>
    <sc-for list="{{ prep }}" as="p" hint-placeholder-count="3">
      <div style="display:flex; align-items:center; gap:10px; padding:7px 0;">
        <span dangerouslySetInnerHTML="{{ p.icon }}" style="flex-shrink:0;"></span>
        <span style="font-size:12.5px; color:{{ p.color }};">{{ p.label }}</span>
      </div>
    </sc-for>
  </div>

  <div style="grid-column:span 2; border:1px solid var(--border); border-radius:20px; background:var(--surface2); padding:24px; box-shadow:var(--shadow);">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <span dangerouslySetInnerHTML="{{ iconAct }}" style="color:var(--accent);"></span>
      <span style="font-size:14px; font-weight:600;">Activity</span>
    </div>
    <sc-for list="{{ activity }}" as="a" hint-placeholder-count="3">
      <div style="display:flex; gap:11px; padding:6px 0;">
        <span style="width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0;"></span>
        <div style="min-width:0;">
          <div style="font-size:12.5px; color:var(--text2); line-height:1.35;">{{ a.text }}</div>
          <div style="font-size:11px; color:var(--muted); margin-top:1px;">{{ a.time }}</div>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;960px&quot;,&quot;height&quot;:&quot;620px&quot;}}">
class Component extends DCLogic {
  icon(p, s) { return '<svg width="' + (s||18) + '" height="' + (s||18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; }
  renderVals() {
    const tl = ['Enquiry','Quote','Contract','Payment','Shoot','Delivery'].map((label, i) => {
      const done = i < 3, now = i === 3;
      return { label, dot: done || now ? 'var(--accent)' : 'var(--border)', ring: now ? '0 0 0 4px var(--accent-soft)' : 'none', color: done || now ? 'var(--text)' : 'var(--muted)', weight: now ? '600' : '450' };
    });
    const check = '<span style="color:var(--ok)">' + this.icon('<path d="M20 6 9 17l-5-5"/>', 15) + '</span>';
    const dot = '<span style="width:15px;height:15px;border-radius:50%;border:1.8px solid var(--border);display:inline-block;box-sizing:border-box;"></span>';
    return {
      iconTimeline: { __html: this.icon('<path d="M3 12h4l3 8 4-16 3 8h4"/>') },
      iconPay: { __html: this.icon('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>') },
      iconFiles: { __html: this.icon('<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/>') },
      iconMsg: { __html: this.icon('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>') },
      iconPrep: { __html: this.icon('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>') },
      iconAct: { __html: this.icon('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>') },
      tl,
      files: [
        { ext: 'PDF', name: 'Contract_v2.pdf', size: '248 KB' },
        { ext: 'PDF', name: 'Shot_list.pdf', size: '96 KB' },
        { ext: 'ZIP', name: 'Moodboard.zip', size: '14 MB' },
      ],
      prep: [
        { label: 'Availability confirmed', icon: { __html: check }, color: 'var(--text2)' },
        { label: 'Shot list reviewed', icon: { __html: check }, color: 'var(--text2)' },
        { label: 'Gear checklist', icon: { __html: dot }, color: 'var(--muted)' },
      ],
      activity: [
        { text: 'Amara accepted the quote', time: '2h ago' },
        { text: 'Deposit of £1,400 received', time: 'Yesterday' },
        { text: 'Questionnaire completed', time: '3 days ago' },
      ],
    };
  }
}
</script>
</body>
</html>
